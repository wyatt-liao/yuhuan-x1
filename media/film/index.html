<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>语环 X1 — 重要的，回头还在。</title>
  <link rel="icon" href="data:,">
  <script>if(!new URLSearchParams(location.search).has('capture')&&!new URLSearchParams(location.search).has('live'))location.replace('./cinema.html');</script>
  <style>
    :root { color-scheme:dark; --ease:cubic-bezier(.23,1,.32,1); }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    html,body { margin:0; background:#020304; color:#e8e9eb; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; height:100%; overflow:hidden; }
    main { width:100%; height:100%; display:grid; place-items:center; }
    #film { width:100%; height:100%; object-fit:contain; display:block; }
    #loading { position:fixed; inset:0; display:grid; place-items:center; background:#020304; letter-spacing:.3em; font-size:12px; color:#7e8793; transition:opacity .6s; }
    #loading.done { opacity:0; pointer-events:none; }
    .controls { position:fixed; inset:auto 5% 22px; opacity:0; transform:translateY(8px); transition:opacity .3s,transform .3s var(--ease); }
    body:hover .controls,body:focus-within .controls,body.paused .controls { opacity:1; transform:translateY(0); }
    .row { display:flex; align-items:center; gap:16px; }
    button { border:0; padding:0; min-width:44px; height:44px; border-radius:50%; color:#e9edf2; background:rgba(35,42,51,.8); cursor:pointer; transition:transform .16s var(--ease),background .16s; display:grid; place-items:center; }
    button:hover { background:#36404e; } button:active { transform:scale(.96); }
    button:focus-visible,input:focus-visible { outline:2px solid #9fbfe9; outline-offset:4px; }
    svg { width:17px; height:17px; fill:currentColor; }
    .title { font-size:12px; letter-spacing:.08em; margin-right:auto; color:#acb4c0; }
    .time { font:11px ui-monospace,SFMono-Regular,monospace; color:#8a94a3; }
    #seek { display:block; appearance:none; width:100%; height:18px; margin:0 0 8px; background:transparent; cursor:pointer; }
    #seek::-webkit-slider-runnable-track { height:2px; background:linear-gradient(to right,#c6d7eb var(--progress,0%),#252c35 var(--progress,0%)); }
    #seek::-webkit-slider-thumb { appearance:none; width:9px; height:9px; margin-top:-3.5px; border-radius:50%; background:#dce6f2; }
    .hint { position:fixed; right:5%; top:28px; color:#67707d; font-size:10px; letter-spacing:.12em; opacity:0; transition:opacity .3s; }
    body:hover .hint,body.paused .hint { opacity:1; }
    @media(max-width:600px) { .controls { inset:auto 5% 16px; }.title { font-size:10px; }.title span { display:none; }.hint { display:none; }.row { gap:10px; } }
    @media(prefers-reduced-motion:reduce) { .controls,#loading { transition:none; } }
  </style>
</head>
<body class="paused">
  <main aria-label="语环 X1 R03 产品演示短片">
    <canvas id="film" width="1920" height="1080" role="img" aria-label="语环 X1 产品概念动画，展示R03 结构外观、24小时循环回溯、四麦唤醒和手机本地AI愿景。"></canvas>
  </main>
  <div id="loading" role="status">语环 X1</div>
  <div class="hint">SPACE 播放 / 暂停　← → 逐段浏览　F 全屏</div>
  <div class="controls" aria-label="影片播放控制">
    <input id="seek" type="range" min="0" max="35" step="0.01" value="0" aria-label="影片进度">
    <div class="row">
      <button id="play" aria-label="播放"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <span class="title">语环 X1 <span style="color:#616d7d">/ 35s</span></span>
      <span class="time" id="time">00:00 / 00:35</span>
      <button id="sound" aria-label="开启声音"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13 3a4 4 0 0 0-2-3.46v6.92A4 4 0 0 0 16 12zm2.7-7.7-1.4 1.4a9 9 0 0 1 0 12.6l1.4 1.4a11 11 0 0 0 0-15.4z"/></svg></button>
      <button id="fullscreen" aria-label="全屏"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg></button>
    </div>
  </div>
  <audio id="score" src="assets/score.m4a" preload="auto"></audio>
  <script type="module" src="film.js"></script>
</body>
</html>
